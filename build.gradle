plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

group = 'com.shinyiv'
version = '1.0.0'
archivesBaseName = 'shinyivmod'

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.impactdev.net/repository/releases/' }
}

dependencies {
    // Fabric API（请确保 fabricApiVersion 在 gradle.properties 里已定义为 0.115.6+1.21.1 或相应版本）
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabricApiVersion}"

    // ---------- 关键：Cobblemon Fabric MDK，仅编译期依赖 ----------
    compileOnly "com.cable-mc:cobblemon-fabric-mdk:1.6.1+1.21.1"
}

java {
    withSourcesJar()
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand project.properties
    }
}
